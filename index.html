<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For My Sonu ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background particles -->
    <div class="particles"></div>


    <!-- Main locked screen -->
    <main class="lock-screen">

        <!-- Small heading -->
        <p class="small-title">
            For My Beautiful Sonu ❤️
        </p>


        <!-- Main title -->
        <h1>
            Your Special Day
        </h1>


        <!-- Photo -->
        <div class="photo-card">

           <img src="sonu.jpg" alt="Sonu">   

            <div class="heart heart-one">❤️</div>
            <div class="heart heart-two">💕</div>
            <div class="heart heart-three">💗</div>

        </div>


        <!-- Countdown heading -->
        <p class="countdown-title">
            Your surprise unlocks in
        </p>


        <!-- Countdown -->
        <div class="countdown">

            <div class="time-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>


        <!-- Locked button -->
        <button id="surpriseButton"
                class="surprise-button">

            🔒 Open My Surprise

        </button>


        <!-- Message -->
        <p id="lockMessage" class="lock-message">
            Your special surprise is waiting for you ❤️
        </p>

    </main>


    <!-- Popup -->
    <div id="popup" class="popup">

        <div class="popup-box">

            <div class="popup-heart">
                💗
            </div>

            <h2>
                Still time is there!
            </h2>

            <p>
                Your surprise is waiting for your special day.
                Come back when the countdown reaches zero. ❤️
            </p>

            <button id="closePopup">
                Okay, I'll Wait 🥹
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
